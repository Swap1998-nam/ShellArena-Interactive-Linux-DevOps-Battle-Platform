apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arena-data
  namespace: shellarena
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shellarena
  namespace: shellarena
spec:
  # SQLite is a single-instance deployment. Do not add replicas or an HPA.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shellarena
  template:
    metadata:
      labels:
        app: shellarena
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace this placeholder with your tested image digest before applying.
          image: ghcr.io/swap1998-nam/shellarena:REPLACE_WITH_TESTED_TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: TRUSTED_HOSTS
              value: shellarena.example.com,localhost,127.0.0.1
            - name: PUBLIC_ORIGIN
              value: https://shellarena.example.com
            - name: DATABASE_PATH
              value: /app/data/shellarena.db
          envFrom:
            - secretRef:
                name: shellarena-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: '1'
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arena-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shellarena
  namespace: shellarena
spec:
  selector:
    app: shellarena
  ports:
    - port: 80
      targetPort: http
