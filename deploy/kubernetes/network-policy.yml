apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shellarena
  namespace: shellarena
spec:
  podSelector:
    matchLabels:
      app: shellarena
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress: []
