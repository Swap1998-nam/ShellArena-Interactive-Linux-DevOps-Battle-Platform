version: "3.9"

services:

  backend:

    build: ./backend

    container_name:
      shellarena_backend

    ports:

      - "5000:5000"

    volumes:

      - ./backend:/app

      - /var/run/docker.sock:/var/run/docker.sock

  frontend:

    image: nginx:alpine

    container_name:
      shellarena_frontend

    ports:

      - "3000:80"

    volumes:

      - ./frontend:/usr/share/nginx/html

    depends_on:

      - backend