services:
  app:
    build: .
    image: shellarena:local
    init: true
    ports:
      - "127.0.0.1:3000:8000"
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:?Run python3 scripts/bootstrap.py first}
      DATABASE_PATH: /app/data/shellarena.db
      TRUSTED_HOSTS: localhost,127.0.0.1
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - arena-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  arena-data:
